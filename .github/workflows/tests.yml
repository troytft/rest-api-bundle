name: Tests
on:
    push:
        branches:
            - master
    pull_request:

jobs:
    tests:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php-versions: [ '8.3', '8.5' ]
                symfony-versions: [ '6.4.*', '7.*' ]
                orm-versions: [ '2.*', '3.*' ]

        env:
            SYMFONY_REQUIRE: ${{ matrix.symfony-versions }}

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-versions }}
                    coverage: none
                    tools: flex
                env:
                    COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            -   run: echo "::add-matcher::${{ runner.tool_cache }}/php.json"
            -   run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

            -   name: Cache Composer packages
                id: composer-cache
                uses: actions/cache@v4
                with:
                    path: vendor
                    key: composer-vendor-cache-${{ matrix.php-versions }}-symfony-${{ matrix.symfony-versions }}-orm-${{ matrix.orm-versions }}-${{ hashFiles('**/composer.json') }}

            -   name: Install dependencies
                if: steps.composer-cache.outputs.cache-hit != 'true'
                run: composer update --no-interaction --no-progress --with "doctrine/orm:${{ matrix.orm-versions }}"

            -   name: Run PHPUnit
                run: make unit-test

            -   name: Run PHP Code Sniffer
                run: make cs-test

            -   name: Run PHPStan
                run: vendor/bin/phpstan analyse --no-progress
